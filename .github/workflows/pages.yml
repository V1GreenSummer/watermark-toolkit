# Build the static web playground (wasm-gc) and deploy it to GitHub Pages.
# Requires the Pages source to be set to "GitHub Actions" once:
#   repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: "Deploy Web Playground to Pages"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "src/**"
      - "moon.mod"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: moon update

      - name: Build wasm-gc playground
        run: sh web/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
