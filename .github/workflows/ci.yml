# CI: strict check, full test suite, formatting gate, native build.
# Hackathon acceptance requires CI for check/build/test (see README).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: moon update

      - name: moon check --deny-warn
        run: moon check --deny-warn

      - name: moon test --deny-warn
        run: moon test --deny-warn

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon build (native CLI)
        run: moon build cmd/main
