<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMTOOL · LLM 文本水印工具箱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="crt-overlay"></div>

<header>
  <div class="logo">
    <span class="logo-glyph">▚▞</span>
    <div>
      <h1 data-i18n="title">WMTOOL</h1>
      <p class="tagline" data-i18n="tagline">LLM 文本水印工具箱 v0.1</p>
    </div>
  </div>
  <div class="header-right">
    <button id="btn-lang" class="btn btn-mini" title="EN / 中文">EN_中文</button>
    <span class="powered">MoonBit · wasm-gc</span>
  </div>
</header>

<nav>
  <button class="tab active" data-tab="inspect" data-i18n="tabInspect">检查</button>
  <button class="tab" data-tab="clean" data-i18n="tabClean">清洗</button>
  <button class="tab" data-tab="detect" data-i18n="tabDetect">检测</button>
</nav>

<main>
  <!-- ============ INSPECT ============ -->
  <section id="panel-inspect" class="panel active">
    <div class="row">
      <label class="check"><input type="checkbox" id="insp-aggressive"><span data-i18n="aggressive">严格模式(标记拉丁同形字)</span></label>
      <label class="check"><input type="checkbox" id="insp-glue"><span data-i18n="stripGlue">视承重字符为可疑</span></label>
    </div>
    <textarea id="insp-input" class="input" rows="7" data-i18n-ph="inputPh" placeholder="在此粘贴文本…"></textarea>
    <div class="actions">
      <button id="insp-run" class="btn btn-primary" data-i18n="runInspect">开始扫描</button>
      <button id="insp-demo" class="btn" data-i18n="loadDemo">载入示例</button>
    </div>
    <div id="insp-summary" class="summary hidden"></div>
    <div id="insp-hits" class="hits"></div>
  </section>

  <!-- ============ CLEAN ============ -->
  <section id="panel-clean" class="panel">
    <div class="row">
      <label class="check"><input type="checkbox" id="clean-spaces" checked><span data-i18n="normSpaces">空格同形字归一</span></label>
      <label class="check"><input type="checkbox" id="clean-homoglyphs"><span data-i18n="aggressive">同形字转 ASCII</span></label>
      <label class="check"><input type="checkbox" id="clean-glue"><span data-i18n="paranoid">偏执模式(连承重字符也剥离)</span></label>
      <label class="check"><input type="checkbox" id="clean-bidi"><span data-i18n="stripBidi">剥离方向控制符</span></label>
    </div>
    <textarea id="clean-input" class="input" rows="7" data-i18n-ph="inputPh" placeholder="在此粘贴文本…"></textarea>
    <div class="actions">
      <button id="clean-run" class="btn btn-primary" data-i18n="runClean">开始清洗</button>
      <button id="clean-demo" class="btn" data-i18n="loadDemo">载入示例</button>
    </div>
    <div id="clean-stats" class="summary hidden"></div>
    <textarea id="clean-output" class="input output" rows="5" readonly data-i18n-ph="outputPh" placeholder="清洗结果…"></textarea>
  </section>

  <!-- ============ DETECT ============ -->
  <section id="panel-detect" class="panel">
    <div class="row">
      <div class="field"><label data-i18n="key">密钥</label><input type="text" id="det-key" value="demo-key" class="txt"></div>
      <div class="field"><label data-i18n="window">窗口 H</label><input type="number" id="det-window" value="4" min="1" max="64" class="txt num"></div>
      <div class="field"><label data-i18n="threshold">阈值</label><input type="number" id="det-threshold" value="0.000001" step="any" class="txt num"></div>
    </div>
    <textarea id="det-input" class="input" rows="7" data-i18n-ph="inputPh" placeholder="在此粘贴文本…"></textarea>
    <div class="actions">
      <button id="det-run" class="btn btn-primary" data-i18n="runDetect">开始检测</button>
      <button id="det-demo" class="btn" data-i18n="loadDemo">载入示例</button>
    </div>
    <div id="det-result" class="detect-result hidden"></div>
  </section>
</main>

<footer>
  <p data-i18n="footer">仅处理你拥有或获授权的内容 · 检测为同密钥重放,阴性结果不构成证据</p>
</footer>

<script src="string-imports.js"></script>
<script src="app.js"></script>
</body>
</html>
